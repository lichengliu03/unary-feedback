# @package _global_

defaults:
  - /base
  - _self_

actor_rollout_ref:
  rollout:
    response_length: 500
    val_kwargs:
      do_sample: True
      temperature: 0.5

agent_proxy:
  max_turn: 1
  max_actions_per_turn: 1

val_agent_proxy:
  max_turn: 1

es_manager:
  train:
    env_configs:
      tags: ["Bandit"]
  val:
    env_groups: 512
    env_configs:
      tags: ["Bandit", "BanditTest"]
      n_groups: [256, 256]
