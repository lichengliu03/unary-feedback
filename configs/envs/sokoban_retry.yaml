# @package _global_

# Sokoban with retry: ~3 turns per attempt, 5 attempts → max_turn=15
defaults:
  - /base
  - _self_

agent_proxy:
  max_turn: 15

val_agent_proxy:
  max_turn: 15

es_manager:
  train:
    env_configs:
      tags: ["SimpleSokobanRetry"]
  val:
    env_configs:
      tags: ["SimpleSokobanRetry"]
