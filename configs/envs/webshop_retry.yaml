# WebShop with retry: ~9 turns per attempt, 5 attempts → max_turn=45
defaults:
  - /base

micro_batch_size_per_gpu: 4
ppo_mini_batch_size: 32

agent_proxy:
  max_turn: 45
  max_actions_per_turn: 1

val_agent_proxy:
  max_turn: 45

actor_rollout_ref:
  rollout:
    max_model_len: 14000
    max_num_batched_tokens: 14000

es_manager:
  train:
    env_configs:
      tags: ["WebShopRetry"]
  val:
    env_configs:
      tags: ["WebShopRetry"]
