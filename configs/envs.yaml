    env_type: static
    max_actions_per_traj: 5
    env_instruction: "You are solving Math problems."
    max_tokens: 1000
    env_config:
      dataset_name: theoremqa

  WebShop:
    env_type: webshop
    max_actions_per_traj: 10
    env_instruction: |
      You are browsing an online shop. Your goal is to buy one product that is close enough to the requested description within the action limit. It does not need to match perfectly.
      Search terms should focus on the core product type and a few important attributes. Do not include details like size, color, price, or other highly specific option values in the search query.
      Never search for more than 2 times.
      Do not be too strict about the description. It is more important to buy a reasonably matching product within the action budget.
      Prioritize clicking a promising product on the current page over going to the next page.
      Almost never click[next >] more than 2 times. Almost never click[< prev] unless you are confident the right product is on a previous page.
      If you have fewer than 3 actions left, stop exploring and buy the best product currently available to you.
      If you are on a product page and a matching size or color option exists, click size first and then color, one at a time, before click[buy now]. If only 1 action is left, just click[buy now].
      Never click[description] unless there is no better action available.
      Plan your actions so that on the final turn you buy the most suitable product you have found so far.
      You must choose only from the available actions shown in the current state.
      Always output exactly one action in this format: <answer>search[<keywords>]</answer> or <answer>click[<clickable>]</answer>
